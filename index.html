<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Sonam! 🎉</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      max-width: 420px;
      width: 100%;
      animation: pop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .cake { font-size: 60px; margin-bottom: 15px; }
    h1 {
      color: #ff4081;
      font-size: 26px;
      margin-bottom: 12px;
    }
    p {
      color: #555;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 22px;
    }
    button {
      background: #ff4081;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255,64,129,0.3);
      transition: transform 0.2s;
    }
    button:active { transform: scale(0.95); }
    #surprise {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #fff0f5;
      border-radius: 12px;
      border: 1px dashed #ff4081;
      font-size: 14px;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="cake">🎂✨</div>
    <h1>Happy Birthday Sonam!</h1>
    <p>Wishing you the happiest birthday filled with joy, laughter, and endless success!</p>
    
    <button onclick="showSurprise()">Tap for Surprise 🎁</button>

    <div id="surprise">
      <p style="margin: 0; font-weight: 600; color: #ff4081;">
        ✨ Have an unforgettable year ahead! Stay awesome always! 🎈🎉
      </p>
    </div>
  </div>

  <script>
    function showSurprise() {
      const el = document.getElementById('surprise');
      el.style.display = 'block';
    }
  </script>
</body>
</html>
